name: Client build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"
  workflow_dispatch: {}

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: McLauncher2027

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      # onedir (не onefile) + collect_all("webview") в build.spec: pywebview
      # везёт свои платформенные бэкенды и JS-файлы динамически, без спеки
      # PyInstaller их не видит и сборка падает пустым окном на чистой машине.
      - name: Build launcher
        run: pyinstaller --noconfirm --clean build.spec

      # Апдейтер — отдельный релизный ассет, не кладём его в архив лаунчера
      # (см. DEV_PLAN.md): лаунчер сам качает свежий app_updater с бэкенда
      # только когда реально нужно обновиться, и удаляет его после работы.
      - name: Build updater
        run: pyinstaller updater/app_updater.py --name app_updater --onefile --noconfirm

      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'macos'
        # Без подписи Gatekeeper объявляет скачанные .app/бинарник «повреждёнными» —
        # платного сертификата разработчика для этого проекта нет.
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"
          codesign --force --sign - "dist/app_updater"

      - name: Package launcher (Windows)
        if: matrix.platform == 'windows'
        working-directory: client/dist
        shell: pwsh
        run: Compress-Archive -Path "$env:APP_NAME" -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Package launcher (macOS)
        if: matrix.platform == 'macos'
        working-directory: client/dist
        run: zip -r "$APP_NAME-macos.zip" "$APP_NAME.app"

      - name: Rename updater binary
        working-directory: client/dist
        shell: bash
        # Уникальное имя ассета в релизе + расширение отличает его от zip'а
        # лаунчера — сервер (launcher_service.py) различает их по .zip vs нет.
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv app_updater.exe app_updater-windows.exe
          else
            mv app_updater app_updater-macos
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: client/dist/${{ env.APP_NAME }}-${{ matrix.platform }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: app_updater-${{ matrix.platform }}
          path: client/dist/app_updater-${{ matrix.platform }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*
