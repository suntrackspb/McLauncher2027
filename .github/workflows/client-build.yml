name: Client build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"
  workflow_dispatch: {}

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      # Единственное место, где берём APP_NAME/BUNDLE_ID — из ui_bridge/config.py,
      # а не дублируем их строкой здесь (см. историю рассинхрона в git log
      # ui_bridge/config.py).
      - name: Read app metadata
        shell: bash
        run: python -c "from ui_bridge.config import APP_NAME, BUNDLE_ID; print(f'APP_NAME={APP_NAME}'); print(f'BUNDLE_ID={BUNDLE_ID}')" >> "$GITHUB_ENV"

      # onedir/standalone (не onefile) — надёжнее для pywebview, см. build.spec
      # раньше / комментарий в app.py. pywebview грузит платформенные бэкенды
      # динамически, поэтому их нужно явно включать через --include-module.
      - name: Build launcher (Windows)
        if: matrix.platform == 'windows'
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=${{ env.APP_NAME }}
          --output-folder-name=${{ env.APP_NAME }}
          --include-data-dir=web=web
          --include-data-dir=assets=assets
          --include-package-data=webview
          --include-module=webview.platforms.edgechromium
          --include-module=webview.platforms.winforms
          --include-package=clr_loader
          --include-package=pythonnet
          --windows-console-mode=disable
          --windows-icon-from-ico=assets/icon.ico
          app.py

      - name: Build launcher (macOS)
        if: matrix.platform == 'macos'
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --output-dir=dist
          --output-folder-name=${{ env.APP_NAME }}
          --include-data-dir=web=web
          --include-data-dir=assets=assets
          --include-package-data=webview
          --include-module=webview.platforms.cocoa
          --macos-create-app-bundle
          --macos-app-name=${{ env.APP_NAME }}
          --macos-signed-app-name=${{ env.BUNDLE_ID }}
          --macos-app-category-type=public.app-category.games
          --macos-app-icon=assets/icon.icns
          app.py

      # Апдейтер — отдельный релизный ассет, не кладём его в архив лаунчера
      # (см. DEV_PLAN.md): лаунчер сам качает свежий app_updater с бэкенда
      # только когда реально нужно обновиться, и удаляет его после работы.
      - name: Build updater
        run: >
          python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=app_updater
          updater/app_updater.py

      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'macos'
        # Без подписи Gatekeeper объявляет скачанные .app/бинарник «повреждёнными» —
        # платного сертификата разработчика для этого проекта нет.
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"
          codesign --force --sign - "dist/app_updater"

      - name: Package launcher (Windows)
        if: matrix.platform == 'windows'
        working-directory: client/dist
        shell: pwsh
        run: Compress-Archive -Path "$env:APP_NAME" -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Package launcher (macOS)
        if: matrix.platform == 'macos'
        working-directory: client/dist
        run: zip -r "$APP_NAME-macos.zip" "$APP_NAME.app"

      - name: Rename updater binary
        working-directory: client/dist
        shell: bash
        # Уникальное имя ассета в релизе + расширение отличает его от zip'а
        # лаунчера — сервер (launcher_service.py) различает их по .zip vs нет.
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv app_updater.exe app_updater-windows.exe
          else
            mv app_updater app_updater-macos
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: client/dist/${{ env.APP_NAME }}-${{ matrix.platform }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: app_updater-${{ matrix.platform }}
          path: client/dist/app_updater-${{ matrix.platform }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*
