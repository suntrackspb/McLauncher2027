name: Client build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Платформа для тестовой сборки"
        type: choice
        default: windows
        options:
          - windows
          - macos
          - all

concurrency:
  group: client-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Гоняется на каждый push/PR — быстрая проверка (секунды), чтобы можно было
  # спокойно открывать PR и коммитить, не дожидаясь долгой Nuitka-сборки.
  # Сама сборка (job "build" ниже) запускается только по тегу v* или вручную.
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["windows","macos"]') }}
    runs-on: ${{ matrix.platform }}-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["windows","macos"]') }}
    runs-on: ${{ matrix.platform }}-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('client/requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('client/requirements.txt') }}-

      - run: pip install -r requirements.txt

      # Версия лаунчера больше не правится руками перед релизом (см. историю
      # с забытым обновлением константы) — на тег v1.0.x просто кладём сюда
      # сам тег, сборка без тега (workflow_dispatch) остаётся с dev-версией
      # из ui_bridge/_version.py, у неё и не должно быть релиза для сверки.
      - name: Set launcher version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "LAUNCHER_VERSION = \"${GITHUB_REF_NAME}\"" > ui_bridge/_version.py

      - name: Read app metadata
        shell: bash
        run: python -c "from ui_bridge.config import APP_NAME, BUNDLE_ID, LAUNCHER_VERSION; print(f'APP_NAME={APP_NAME}'); print(f'BUNDLE_ID={BUNDLE_ID}'); print(f'LAUNCHER_VERSION={LAUNCHER_VERSION}')" >> "$GITHUB_ENV"

      # onedir/standalone (не onefile) — надёжнее для pywebview, см. build.spec
      # раньше / комментарий в app.py. pywebview грузит платформенные бэкенды
      # динамически, поэтому их нужно явно включать через --include-module.
      - name: Build launcher (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --output-dir=dist
          "--output-filename=$env:APP_NAME"
          "--output-folder-name=$env:APP_NAME"
          --include-data-dir=web=web
          --include-data-dir=assets=assets
          --include-package-data=webview
          --include-package-data=minecraft_launcher_lib
          --include-module=webview.platforms.edgechromium
          --include-module=webview.platforms.winforms
          --include-package=clr_loader
          --include-package=pythonnet
          --windows-console-mode=attach
          --windows-icon-from-ico=assets/icon.ico
          app.py

      - name: Build launcher (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: >
          python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --output-dir=dist
          "--output-folder-name=$APP_NAME"
          --include-data-dir=web=web
          --include-data-dir=assets=assets
          --include-package-data=webview
          --include-package-data=minecraft_launcher_lib
          --include-module=webview.platforms.cocoa
          --macos-create-app-bundle
          "--macos-app-name=$APP_NAME"
          "--macos-signed-app-name=$BUNDLE_ID"
          --macos-app-category-type=public.app-category.games
          --macos-app-icon=assets/icon.icns
          app.py

      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'macos'
        # Без подписи Gatekeeper объявляет скачанное .app «повреждённым» —
        # платного сертификата разработчика для этого проекта нет.
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"

      - name: Package launcher (Windows)
        if: matrix.platform == 'windows'
        working-directory: client/dist
        shell: pwsh
        # Nuitka --standalone всегда добавляет суффикс .dist к папке (в отличие
        # от --macos-create-app-bundle, где .app это и есть весь суффикс) —
        # даже когда --output-folder-name задан явно. Переименовываем перед
        # архивацией, чтобы распакованная папка не торчала как "X.dist".
        run: |
          Rename-Item -Path "$env:APP_NAME.dist" -NewName "$env:APP_NAME"
          Compress-Archive -Path "$env:APP_NAME" -DestinationPath "$env:APP_NAME-windows.zip"

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            $compiler = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $compiler 'installer/launcher.iss'

      - name: Package launcher (macOS)
        if: matrix.platform == 'macos'
        working-directory: client/dist
        run: ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "$APP_NAME-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: client/dist/${{ env.APP_NAME }}-${{ matrix.platform }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: McLauncher2027-Setup
          path: client/dist/McLauncher2027-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*
