name: Updater build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]
    runs-on: ${{ matrix.platform }}-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Build updater
        run: >
          python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=app_updater-${{ matrix.platform }}
          updater/app_updater.py

      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'macos'
        run: |
          codesign --force --sign - dist/app_updater-macos
          codesign --verify --strict dist/app_updater-macos

      - uses: actions/upload-artifact@v4
        with:
          name: app_updater-${{ matrix.platform }}
          path: client/dist/app_updater-${{ matrix.platform }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          if-no-files-found: error
