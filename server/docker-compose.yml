services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launcher
      POSTGRES_PASSWORD: launcher
      POSTGRES_DB: launcher
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launcher -d launcher"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    # Миграции (alembic upgrade head) идут в CMD при каждом старте контейнера —
    # ждём, пока Postgres реально начнёт принимать подключения.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://launcher:launcher@db/launcher
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

volumes:
  db_data:
