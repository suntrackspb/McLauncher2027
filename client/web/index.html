<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SNTRK Minecraft</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Загрузка -->
  <section id="screen-loading" class="screen active">
    <div class="cube loader-cube" aria-hidden="true"></div>
    <p class="loader-text">Инициализация…</p>
  </section>

  <!-- Баннер обновления -->
  <div id="update-banner" class="update-banner" hidden>
    <span id="update-banner-text">Доступна новая версия лаунчера</span>
    <div class="update-banner-actions">
      <button id="btn-update-now" class="btn btn-primary btn-small">Обновить</button>
      <button id="btn-update-later" class="btn btn-secondary btn-small">Позже</button>
    </div>
  </div>

  <!-- Вход / регистрация -->
  <section id="screen-auth" class="screen">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-logo">MC</div>

        <h1>SNTRK <span class="accent">Minecraft</span></h1>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="form-login" class="tab-panel active" data-panel="login">
        <label>Никнейм
          <input type="text" name="username" autocomplete="username" required maxlength="16" />
        </label>
        <label>Пароль
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <form id="form-register" class="tab-panel" data-panel="register">
        <label>Никнейм
          <input type="text" name="username" required maxlength="16" pattern="[A-Za-z][A-Za-z0-9_]{2,15}" />
        </label>
        <label>Пароль
          <input type="password" name="password" required minlength="4" />
        </label>
        <button type="submit" class="btn btn-primary">Создать аккаунт</button>
      </form>

      <p id="auth-error" class="error-text" hidden></p>
    </div>
  </section>

  <!-- Главный экран -->
  <section id="screen-main" class="screen">
    <header class="topbar">
      <div class="brand brand-compact">
        <div class="brand-logo small">MC</div>
        <span>New Year Weekend <span class="accent">2027</span></span>
        <span id="launcher-version" class="version-pill"></span>
      </div>
      <div class="topbar-actions">
        <span class="username-pill">
          <canvas id="user-head" class="user-head" width="8" height="8" aria-hidden="true"></canvas>
          <span id="current-username"></span>
        </span>
        <button id="btn-settings" class="icon-btn" title="Настройки" aria-label="Настройки"></button>
        <button id="btn-mods" class="icon-btn" title="Опциональные моды" aria-label="Моды"></button>
        <button id="btn-skin" class="icon-btn" title="Скин и плащ" aria-label="Скин и плащ"></button>
        <button id="btn-reinstall" class="icon-btn" title="Переустановить" aria-label="Переустановить"></button>
        <button id="btn-logout" class="icon-btn" title="Выйти" aria-label="Выйти"></button>
      </div>
    </header>

    <main class="main-content">
      <div class="play-slot" data-mode="play">
        <button id="btn-play" class="play-button">
          <span class="play-label">PLAY</span>
        </button>
        <div class="garland" aria-hidden="true"></div>
      </div>
      <dl id="profile-info" class="profile-info" hidden>
        <div><dt>Сборка</dt><dd id="profile-build"></dd></div>
        <div><dt>Сервер</dt><dd id="profile-server"></dd></div>
      </dl>
    </main>

    <footer class="ground-progress">
      <p id="status-text" class="status-text">Готово к запуску</p>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </footer>
  </section>

  <!-- Панель настроек -->
  <aside id="panel-settings" class="side-panel">
    <div class="side-panel-header">
      <h2>Настройки</h2>
      <button class="icon-btn close-btn" data-close="panel-settings"></button>
    </div>
    <div class="side-panel-body">
      <label>Оперативная память: <span id="ram-value">4096</span> МБ
        <input type="range" id="input-ram" min="1024" max="16384" step="512" value="4096" />
      </label>
      <label>Ширина окна
        <input type="number" id="input-width" min="800" max="7680" value="1280" />
      </label>
      <label>Высота окна
        <input type="number" id="input-height" min="600" max="4320" value="720" />
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="input-fullscreen" />
        Полноэкранный режим
      </label>
      <label>Путь к Java (необязательно)
        <div class="input-with-button">
          <input type="text" id="input-java-path" placeholder="Определится автоматически" />
          <button id="btn-browse-java" class="btn btn-secondary" type="button">Обзор…</button>
        </div>
      </label>
      <label>Доп. аргументы JVM
        <input type="text" id="input-jvm-args" placeholder="-XX:MaxPermSize=256M" />
      </label>
      <label>Доп. аргументы игры
        <input type="text" id="input-game-args" placeholder="--server 127.0.0.1" />
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="input-debug" />
        Подробный лог запуска
      </label>
      <button id="btn-save-settings" class="btn btn-secondary">Сохранить</button>
    </div>
  </aside>

  <!-- Панель опциональных модов -->
  <aside id="panel-mods" class="side-panel">
    <div class="side-panel-header">
      <h2>Опциональные моды</h2>
      <button class="icon-btn close-btn" data-close="panel-mods"></button>
    </div>
    <div class="side-panel-body">
      <ul id="mods-list" class="mods-list"></ul>
    </div>
  </aside>

  <!-- Панель скина и плаща -->
  <aside id="panel-skin" class="side-panel">
    <div class="side-panel-header">
      <h2>Скин и плащ</h2>
      <button class="icon-btn close-btn" data-close="panel-skin"></button>
    </div>
    <div class="side-panel-body">
      <div class="texture-previews">
        <figure class="texture-card">
          <canvas id="skin-preview" class="texture-canvas" width="16" height="32"></canvas>
          <figcaption id="skin-caption">Скин</figcaption>
        </figure>
        <figure class="texture-card">
          <canvas id="cape-preview" class="texture-canvas" width="10" height="16"></canvas>
          <figcaption id="cape-caption">Плащ</figcaption>
        </figure>
      </div>
      <div class="texture-actions">
        <button id="btn-upload-skin" class="btn btn-secondary" type="button">Загрузить скин…</button>
        <button id="btn-delete-skin" class="btn btn-danger" type="button" title="Удалить скин" hidden>Удалить</button>
      </div>
      <div class="texture-actions">
        <button id="btn-upload-cape" class="btn btn-secondary" type="button">Загрузить плащ…</button>
        <button id="btn-delete-cape" class="btn btn-danger" type="button" title="Удалить плащ" hidden>Удалить</button>
      </div>
      <p class="texture-hint">PNG: скин 64×64 или 64×32, плащ 64×32. Игроки увидят изменения после перезахода на сервер.</p>
      <p id="texture-status" class="status-text"></p>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>
</div>

<script src="fx.js"></script>
<script src="script.js"></script>
</body>
</html>
